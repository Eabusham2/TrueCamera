name: Core policy tests on Linux
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Unused in core-only validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile and execute core tests
        run: |
          set -euo pipefail
          swift --version
          mkdir -p build/logs
          swift test --parallel 2>&1 | tee build/logs/core-linux.log
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-linux-${{ github.sha }}
          path: build/logs/
          if-no-files-found: ignore
